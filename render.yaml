# Render – backend (Flask) for "reading from root"
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: reading-from-root-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
